[project]
name = "energy-trading"
version = "0.1.0"
description = "ERCOT Day-Ahead vs Real-Time spread forecasting and virtual trading backtest"
requires-python = ">=3.11"
dependencies = [
    "gridstatus>=0.22",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "plotly>=5.0",
    "numpy>=1.26",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pytz>=2025.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_trading"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.2",
]
